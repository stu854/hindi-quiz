<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Toddler Hindi Quiz</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #FFF9E6; margin: 0; padding: 15px; user-select: none; }
    .card { background: white; border-radius: 24px; padding: 20px; max-width: 520px; margin: auto; box-shadow: 0 6px 20px rgba(0,0,0,0.08); position: relative; min-height: 480px; display: flex; flex-direction: column; justify-content: space-between; }
    .progress-bar { font-size: 1rem; color: #757575; font-weight: bold; margin-bottom: 8px; }
    .q-title { font-size: 1.5rem; margin: 10px 0; color: #2C3E50; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .q-img { max-height: 160px; max-width: 90%; border-radius: 16px; margin: 10px auto; object-fit: contain; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 15px; }
    .opt-btn { background: #F4FBF7; border: 3px solid #81C784; border-radius: 20px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 150px; font-size: 1.4rem; font-weight: bold; transition: transform 0.15s, border-color 0.2s, background-color 0.2s; }
    .opt-btn:active { transform: scale(0.96); }
    .opt-btn img { max-height: 95px; max-width: 90%; margin-bottom: 8px; object-fit: contain; }
    .speaker-btn { background: #FFD54F; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.15); }
    .feedback-banner { min-height: 36px; font-size: 1.3rem; font-weight: bold; margin-top: 12px; }
    .correct-anim { background: #C8E6C9 !important; border-color: #2E7D32 !important; transform: scale(1.03); }
    .wrong-anim { background: #FFCDD2 !important; border-color: #C62828 !important; }
  </style>
</head>
<body>

<div class="card" id="quiz-box">
  <div style="margin: auto;">
    <h1 style="font-size: 2rem; color: #2E7D32;">नमस्ते! 🌟</h1>
    <p style="font-size: 1.2rem; color: #555;">हिंदी अभ्यास शुरू करें</p>
    <button onclick="showMenu()" style="font-size: 1.5rem; padding: 16px 36px; border-radius: 16px; background: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(76,175,80,0.4);">शुरू करें (Start)</button>
  </div>
</div>

<!-- Load all quiz datasets -->
<script src="quizzes/quiz1.js"></script>
<script src="quizzes/quiz2.js"></script>
<script src="quizzes/quiz3.js"></script>
<script src="quizzes/quiz4.js"></script>

<script>
const allQuizzes = {
  paper1: { title: "अभ्यास 1 (Sample Paper 1)", data: (typeof quiz1 !== 'undefined' ? quiz1 : []), icon: "🍎" },
  paper2: { title: "अभ्यास 2 (Sample Paper 2)", data: (typeof quiz2 !== 'undefined' ? quiz2 : []), icon: "🐘" },
  paper3: { title: "अभ्यास 3 (Sample Paper 3)", data: (typeof quiz3 !== 'undefined' ? quiz3 : []), icon: "🦜" },
  paper4: { title: "अभ्यास 4 (Sample Paper 4)", data: (typeof quiz4 !== 'undefined' ? quiz4 : []), icon: "🌟" }
};

let currentQuizData = [];
let currentIndex = 0;
let isAnsweringBlocked = false;

// Speech engine helper
function speakHindi(text, onEndCallback = null) {
  if (!('speechSynthesis' in window)) return;
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'hi-IN';
  utterance.rate = 0.85;
  utterance.pitch = 1.05;

  const voices = window.speechSynthesis.getVoices();
  const hindiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('hi-IN'));
  if (hindiVoice) utterance.voice = hindiVoice;

  if (onEndCallback) {
    utterance.onend = onEndCallback;
  }

  window.speechSynthesis.speak(utterance);
}

// Speaks Question -> Option 1 -> Option 2 in sequence
function readEntireCard(item) {
  window.speechSynthesis.cancel();
  if (!item) return;

  speakHindi(item.q, () => {
    if (item.opts && item.opts[0]) {
      speakHindi("पहला: " + item.opts[0].text, () => {
        if (item.opts && item.opts[1]) {
          speakHindi("दूसरा: " + item.opts[1].text);
        }
      });
    }
  });
}

function replayQuestion() {
  window.speechSynthesis.cancel();
  if (currentQuizData && currentQuizData[currentIndex]) {
    readEntireCard(currentQuizData[currentIndex]);
  }
}

function replayOption(optIdx) {
  window.speechSynthesis.cancel();
  if (currentQuizData && currentQuizData[currentIndex] && currentQuizData[currentIndex].opts[optIdx]) {
    speakHindi(currentQuizData[currentIndex].opts[optIdx].text);
  }
}

// Menu Screen
function showMenu() {
  window.speechSynthesis.cancel();
  const container = document.getElementById('quiz-box');
  
  let menuHtml = `
    <h1 style="font-size: 1.8rem; color: #2E7D32; margin-bottom: 15px;">क्विज़ चुनें 📚</h1>
    <div style="display: flex; flex-direction: column; gap: 12px; margin: auto; width: 100%;">
  `;

  for (const key in allQuizzes) {
    const item = allQuizzes[key];
    menuHtml += `
      <button onclick="selectQuiz('${key}')" style="
        font-size: 1.3rem;
        padding: 14px;
        border-radius: 16px;
        background: #E8F5E9;
        border: 2px solid #81C784;
        cursor: pointer;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      ">
        <span>${item.icon}</span> ${item.title}
      </button>
    `;
  }

  menuHtml += `</div>`;
  container.innerHTML = menuHtml;
  speakHindi("कृपया कोई एक क्विज़ चुनें");
}

function selectQuiz(quizKey) {
  currentQuizData = allQuizzes[quizKey].data;
  if (!currentQuizData || currentQuizData.length === 0) {
    alert("यह क्विज़ फ़ाइल अभी उपलब्ध नहीं है। कृपया फ़ाइल लोड चेक करें।");
    return;
  }
  currentIndex = 0;
  loadQuestion();
}

function loadQuestion() {
  isAnsweringBlocked = false;
  const item = currentQuizData[currentIndex];
  const container = document.getElementById('quiz-box');

  let html = `
    <div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <button onclick="showMenu()" style="background: #EEE; border: none; border-radius: 10px; padding: 6px 12px; font-weight: bold; cursor: pointer;">🏠 मेनू</button>
        <div class="progress-bar">प्रश्न ${currentIndex + 1} / ${currentQuizData.length}</div>
      </div>
      <div class="q-title">
        <span>${item.q}</span>
        <button class="speaker-btn" type="button" onclick="replayQuestion()">🔊</button>
      </div>
      ${item.img ? `<img src="${item.img}" class="q-img" onerror="this.style.display='none'">` : ''}
    </div>
    
    <div>
      <div class="options-grid">`;

  item.opts.forEach((opt, optIdx) => {
    html += `
      <div class="opt-btn" id="opt-${optIdx}" onclick="handleOptionClick(${opt.correct}, ${optIdx})">
        <button class="speaker-btn" style="width:34px; height:34px; font-size:14px; margin-bottom:6px;" 
                type="button"
                onclick="event.stopPropagation(); replayOption(${optIdx});">🔊</button>
        ${opt.img ? `<img src="${opt.img}" onerror="this.style.display='none'">` : ''}
        <span>${opt.text}</span>
      </div>`;
  });

  html += `
      </div>
      <div class="feedback-banner" id="feedback-text"></div>
    </div>`;

  container.innerHTML = html;
  readEntireCard(item);
}

function handleOptionClick(isCorrect, optIdx) {
  if (isAnsweringBlocked) return;
  window.speechSynthesis.cancel();

  const selectedBtn = document.getElementById(`opt-${optIdx}`);
  const feedbackEl = document.getElementById('feedback-text');

  if (isCorrect) {
    isAnsweringBlocked = true;
    selectedBtn.classList.add('correct-anim');
    feedbackEl.innerHTML = "<span style='color:#2E7D32;'>🎉 शाबाश! बहुत बढ़िया!</span>";
    speakHindi("शाबाश! बहुत बढ़िया!");

    setTimeout(() => {
      currentIndex++;
      if (currentIndex < currentQuizData.length) {
        loadQuestion();
      } else {
        showCelebrationScreen();
      }
    }, 1500);

  } else {
    selectedBtn.classList.add('wrong-anim');
    feedbackEl.innerHTML = "<span style='color:#C62828;'>❌ फिर से कोशिश करो</span>";
    speakHindi("गलत उत्तर, फिर से कोशिश करो");

    setTimeout(() => {
      selectedBtn.classList.remove('wrong-anim');
    }, 700);
  }
}

function showCelebrationScreen() {
  const container = document.getElementById('quiz-box');
  speakHindi("बधाई हो! आपने सभी प्रश्न पूरे कर लिए हैं!");
  container.innerHTML = `
    <div style="margin: auto;">
      <h1 style="font-size: 3rem; margin: 0;">🏆 ⭐ 🎈</h1>
      <h2 style="color: #2E7D32; font-size: 1.8rem; margin: 15px 0;">शानदार काम!</h2>
      <p style="font-size: 1.2rem; color: #555;">आपने सभी सवाल हल कर लिए!</p>
      <button onclick="showMenu()" style="font-size: 1.3rem; padding: 14px 28px; border-radius: 14px; background: #FF9800; color: white; border: none; font-weight: bold; cursor: pointer;">मेनू पर जाएँ (Back to Menu)</button>
    </div>`;
}
</script>
</body>
</html>
