let index = 0;

function speak(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'hi-IN';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

function startQuiz() {
  loadQuestion();
}

function loadQuestion() {
  const item = quiz[index];
  const container = document.getElementById('quiz-box');
  
  let html = `<h2 style="font-size: 1.6rem;">${item.q} <button class="speaker-btn" onclick="speak('${item.q}')">🔊</button></h2>`;
  if (item.img) html += `<img src="${item.img}" class="q-img">`;
  
  html += `<div class="options-grid">`;
  item.opts.forEach((opt) => {
    html += `
      <div class="opt-btn" onclick="checkAnswer(${opt.correct})">
        ${opt.img ? `<img src="${opt.img}">` : ''}
        <span>${opt.text}</span>
      </div>`;
  });
  html += `</div>`;
  
  container.innerHTML = html;
  speak(item.q);
}

function checkAnswer(isCorrect) {
  if (isCorrect) {
    speak("बहुत बढ़िया! शाबाश!");
    alert("🎉 सही उत्तर!");
  } else {
    speak("गलत उत्तर, फिर से कोशिश करो!");
  }
}
