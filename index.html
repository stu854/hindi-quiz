// Unified Speech Function with Optional 'On Finish' Callback
function speakHindi(text, onEndCallback = null) {
  if (!('speechSynthesis' in window)) return;
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'hi-IN';
  utterance.rate = 0.85; // Toddler friendly speed
  utterance.pitch = 1.05;

  const voices = window.speechSynthesis.getVoices();
  const hindiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('hi-IN'));
  if (hindiVoice) utterance.voice = hindiVoice;

  if (onEndCallback) {
    utterance.onend = onEndCallback;
  }

  window.speechSynthesis.speak(utterance);
}

// Speaks Question -> Option 1 -> Option 2 in sequence
function readEntireCard(item) {
  window.speechSynthesis.cancel(); // Stop any pending speech

  // 1. Speak Question
  speakHindi(item.q, () => {
    // 2. Speak Option 1
    speakHindi("पहला: " + item.opts[0].text, () => {
      // 3. Speak Option 2
      speakHindi("दूसरा: " + item.opts[1].text);
    });
  });
}

function startQuiz() {
  currentIndex = 0;
  loadQuestion();
}

function loadQuestion() {
  isAnsweringBlocked = false;
  const item = quiz[currentIndex];
  const container = document.getElementById('quiz-box');
  
  let html = `
    <div>
      <div class="progress-bar">प्रश्न ${currentIndex + 1} / ${quiz.length}</div>
      <div class="q-title">
        <span>${item.q}</span>
        <button class="speaker-btn" onclick="readEntireCard(quiz[currentIndex])">🔊</button>
      </div>
      ${item.img ? `<img src="${item.img}" class="q-img" onerror="this.style.display='none'">` : ''}
    </div>
    
    <div>
      <div class="options-grid">`;
  
  item.opts.forEach((opt, optIdx) => {
    html += `
      <div class="opt-btn" id="opt-${optIdx}" onclick="handleOptionClick(${opt.correct}, ${optIdx})">
        <button class="speaker-btn" style="width:34px; height:34px; font-size:14px; margin-bottom:6px;" 
                onclick="event.stopPropagation(); window.speechSynthesis.cancel(); speakHindi('${opt.text}');">🔊</button>
        ${opt.img ? `<img src="${opt.img}" onerror="this.style.display='none'">` : ''}
        <span>${opt.text}</span>
      </div>`;
  });

  html += `
      </div>
      <div class="feedback-banner" id="feedback-text"></div>
    </div>`;
  
  container.innerHTML = html;
  
  // Read Question and Options aloud automatically
  readEntireCard(item);
}

function handleOptionClick(isCorrect, optIdx) {
  if (isAnsweringBlocked) return;
  window.speechSynthesis.cancel(); // Stop narrator when child taps

  const selectedBtn = document.getElementById(`opt-${optIdx}`);
  const feedbackEl = document.getElementById('feedback-text');

  if (isCorrect) {
    isAnsweringBlocked = true;
    selectedBtn.classList.add('correct-anim');
    feedbackEl.innerHTML = "<span style='color:#2E7D32;'>🎉 शाबाश! बहुत बढ़िया!</span>";
    speakHindi("शाबाश! बहुत बढ़िया!");

    setTimeout(() => {
      currentIndex++;
      if (currentIndex < quiz.length) {
        loadQuestion();
      } else {
        showCelebrationScreen();
      }
    }, 1500);

  } else {
    selectedBtn.classList.add('wrong-anim');
    feedbackEl.innerHTML = "<span style='color:#C62828;'>❌ फिर से कोशिश करो</span>";
    speakHindi("गलत उत्तर, फिर से कोशिश करो");

    setTimeout(() => {
      selectedBtn.classList.remove('wrong-anim');
    }, 700);
  }
}
  


function showCelebrationScreen() {
  const container = document.getElementById('quiz-box');
  speak("बधाई हो! आपने सभी प्रश्न पूरे कर लिए हैं!");
  container.innerHTML = `
    <div style="margin: auto;">
      <h1 style="font-size: 3rem; margin: 0;">🏆 ⭐ 🎈</h1>
      <h2 style="color: #2E7D32; font-size: 1.8rem; margin: 15px 0;">शानदार काम!</h2>
      <p style="font-size: 1.2rem; color: #555;">आपने सभी सवाल हल कर लिए!</p>
      <button onclick="startQuiz()" style="font-size: 1.3rem; padding: 14px 28px; border-radius: 14px; background: #FF9800; color: white; border: none; font-weight: bold; cursor: pointer;">फिर से खेलें (Play Again)</button>
    </div>`;
}
